
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/header :: common-head"></head>
<body>
    <div th:replace="layout/navbar :: sidebar"></div>
    <div id="content" style="margin-left:260px; padding:1.5rem; min-height:100vh;">
        <div class="content-header bg-white rounded-3 p-4 mb-4 shadow-sm">
            <h1 class="h3 mb-2">
                <i class="fas fa-user-check me-2"></i>Demandes d'inscription
            </h1>
            <p class="text-muted mb-0">Liste des étudiants sans inscription</p>
        </div>
        <div class="table-container bg-white rounded-3 p-4 shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Nom</th>
                            <th>Prénom</th>
                            <th>Email</th>
                            <th>Spécialité</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="etudiant : ${etudiantsSansInscription}">
                            <td th:text="${etudiant.nom}"></td>
                            <td th:text="${etudiant.prenom}"></td>
                            <td th:text="${etudiant.email}"></td>
                            <td th:text="${etudiant.specialite != null ? etudiant.specialite : 'N/A'}"></td>
                            <td>
                                <button type="button" class="btn btn-success btn-sm" 
                                    style="background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); border: none; padding: 0.5rem 1rem; border-radius: 10px; font-weight: 600; box-shadow: 0 4px 15px rgba(17, 153, 142, 0.4); transition: all 0.3s ease;"
                                    data-bs-toggle="modal" 
                                    data-bs-target="#valideInscriptionModal"
                                    th:attr="data-id=${etudiant.id},data-nom=${etudiant.nom},data-prenom=${etudiant.prenom},data-email=${etudiant.email},data-specialite=${etudiant.specialite != null ? etudiant.specialite : ''}">
                                    <i class="fas fa-check me-1"></i>Valider
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div th:replace="layout/footer :: footer"></div>
    <!-- Modal pour validation d'inscription -->
    <div class="modal fade" id="valideInscriptionModal" tabindex="-1" aria-labelledby="valideInscriptionLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="valideInscriptionForm" th:action="@{/admin/demande/valider}" method="post">
                    <div class="modal-header">
                        <h5 class="modal-title" id="valideInscriptionLabel">Valider l'inscription</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Nom de l'étudiant</label>
                            <input type="text" class="form-control" id="modalEtudiantNom" readonly>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Prénom de l'étudiant</label>
                            <input type="text" class="form-control" id="modalEtudiantPrenom" readonly>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Groupe</label>
                            <select class="form-select" id="modalGroupeId" name="groupeId" required>
                                <option th:each="groupe : ${groupes}" 
                                        th:value="${groupe.id}" 
                                        th:text="${groupe.code + ' - ' + (groupe.specialite != null ? groupe.specialite.libelle : 'Sans spécialité')}"
                                        th:data-specialite="${groupe.specialite != null ? groupe.specialite.name() : ''}"></option>
                            </select>
                            <div id="alerteCapacite" th:if="${alerteCapacite}" class="alert alert-danger mt-2" th:text="${alerteCapacite}"></div>
                        </div>
                        <input type="hidden" name="idEtudiant" id="modalEtudiantId" />
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                        <button type="submit" class="btn btn-success">Valider</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function() {
        var modal = document.getElementById('valideInscriptionModal');
        var groupeSelect = document.getElementById('modalGroupeId');
        var allOptions = Array.from(groupeSelect.options).map(opt => ({
            value: opt.value,
            text: opt.text,
            specialite: opt.getAttribute('data-specialite')
        }));
        
        modal.addEventListener('show.bs.modal', function (event) {
            var button = event.relatedTarget;
            if (button) {
                var id = button.getAttribute('data-id');
                var nom = button.getAttribute('data-nom');
                var prenom = button.getAttribute('data-prenom');
                var specialiteEtudiant = button.getAttribute('data-specialite');
                
                // Remplir les champs du modal
                document.getElementById('modalEtudiantId').value = id;
                document.getElementById('modalEtudiantNom').value = nom;
                document.getElementById('modalEtudiantPrenom').value = prenom;
                
                // Filtrer les groupes par spécialité
                groupeSelect.innerHTML = '';
                allOptions.forEach(function(opt) {
                    if (opt.specialite === specialiteEtudiant || !specialiteEtudiant) {
                        var option = document.createElement('option');
                        option.value = opt.value;
                        option.text = opt.text;
                        option.setAttribute('data-specialite', opt.specialite);
                        groupeSelect.appendChild(option);
                    }
                });
                
                // Si aucun groupe ne correspond, afficher un message
                if (groupeSelect.options.length === 0) {
                    var option = document.createElement('option');
                    option.value = '';
                    option.text = 'Aucun groupe disponible pour cette spécialité';
                    option.disabled = true;
                    groupeSelect.appendChild(option);
                }
            }
        });
        
        // Fonction pour filtrer les groupes par spécialité
        function filtrerGroupesParSpecialite(specialiteEtudiant) {
            groupeSelect.innerHTML = '';
            allOptions.forEach(function(opt) {
                if (opt.specialite === specialiteEtudiant || !specialiteEtudiant) {
                    var option = document.createElement('option');
                    option.value = opt.value;
                    option.text = opt.text;
                    option.setAttribute('data-specialite', opt.specialite);
                    groupeSelect.appendChild(option);
                }
            });
            
            // Si aucun groupe ne correspond, afficher un message
            if (groupeSelect.options.length === 0) {
                var option = document.createElement('option');
                option.value = '';
                option.text = 'Aucun groupe disponible pour cette spécialité';
                option.disabled = true;
                groupeSelect.appendChild(option);
            }
        }
        
        // Ouvrir le modal automatiquement si erreur
        var showModal = /*[[${showModal != null && showModal}]]*/ false;
        if (showModal) {
            var etudiantId = /*[[${etudiantErreur != null ? etudiantErreur.id : null}]]*/ null;
            var etudiantNom = /*[[${etudiantErreur != null ? etudiantErreur.nom : ''}]]*/ '';
            var etudiantPrenom = /*[[${etudiantErreur != null ? etudiantErreur.prenom : ''}]]*/ '';
            var etudiantSpecialite = /*[[${etudiantErreur != null ? etudiantErreur.specialite : ''}]]*/ '';
            
            document.getElementById('modalEtudiantId').value = etudiantId;
            document.getElementById('modalEtudiantNom').value = etudiantNom;
            document.getElementById('modalEtudiantPrenom').value = etudiantPrenom;
            
            // Filtrer les groupes par spécialité de l'étudiant en erreur
            filtrerGroupesParSpecialite(etudiantSpecialite);
            
            var bsModal = new bootstrap.Modal(document.getElementById('valideInscriptionModal'));
            bsModal.show();
        }
    });
    </script>
</body>
</html>
