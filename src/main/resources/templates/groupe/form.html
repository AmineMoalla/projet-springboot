<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouveau Groupe - IIT School</title>
    <head th:replace="layout/header :: common-head"></head>
</head>
<body>
    <div th:replace="layout/navbar :: sidebar"></div>
    <div id="content">
        <div class="content-header">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h1 class="h3 mb-2">
                        <i class="fas fa-plus-circle me-2"></i>Nouveau Groupe
                    </h1>
                    <p class="text-muted mb-0">Remplissez les informations du groupe</p>
                </div>
                <a href="/admin/groupe" class="btn btn-outline-secondary">
                    <i class="fas fa-arrow-left me-2"></i>Retour à la liste
                </a>
            </div>
        </div>
        <div class="form-container bg-white rounded-3 p-4 shadow-sm mt-4" style="max-width:600px;margin:0 auto;">
            <form th:action="@{/admin/groupe/save}" method="post">

    <div class="mb-3">
        <label for="code" class="form-label">Code du groupe *</label>
        <input type="text" class="form-control" id="code" name="code"
               th:value="${groupe.code}" required>
    </div>

    <div class="mb-3">
        <label for="niveau" class="form-label">Niveau *</label>
        <select class="form-select" id="niveau" name="niveau" required>
            <option value="" disabled selected>Choisir un niveau</option>
            <option value="1" th:selected="${groupe.niveau == '1'}">1</option>
            <option value="2" th:selected="${groupe.niveau == '2'}">2</option>
            <option value="3" th:selected="${groupe.niveau == '3'}">3</option>
        </select>
    </div>

    <div class="mb-3">
        <label for="capacite" class="form-label">Capacité *</label>
        <input type="number" class="form-control" id="capacite" name="capacite"
               th:value="${groupe.capacite}" min="1" required>
    </div>

    <div class="mb-3">
        <label for="specialite" class="form-label">Spécialité *</label>
        <select class="form-select" id="specialite" name="specialite" required>
            <option value="" disabled selected>Choisir une spécialité</option>
            <option th:each="spec : ${specialites}" 
                    th:value="${spec}" 
                    th:text="${spec.libelle}"
                    th:selected="${groupe.specialite == spec}">
            </option>
        </select>
    </div>

    <div class="d-flex justify-content-between mt-4">
        <button type="submit" class="btn btn-primary" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; padding: 0.75rem 1.5rem; border-radius: 12px; font-weight: 600; box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4); transition: all 0.3s ease;">
            <i class="fas fa-save me-2"></i>Créer le groupe
        </button>
    </div>
</form>

        </div>
    </div>
    <div th:replace="layout/footer :: footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
