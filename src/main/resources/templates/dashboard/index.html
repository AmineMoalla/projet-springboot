<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/header :: common-head"></head>
<body>
    <!-- Sidebar -->
    <div th:replace="layout/navbar :: sidebar"></div>
    <!-- Main Content -->
    <div id="content">
        <!-- Header -->
        <div class="content-header">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h1 class="h3 mb-2" style="font-weight: 700;">Tableau de bord</h1>
                    <p class="text-muted mb-0">Bienvenue dans le panel d'administration YFA School</p>
                </div>
                <div class="d-flex align-items-center">
                    <div class="me-3 text-end">
                        <small class="text-muted d-block">Connecté en tant que</small>
                        <strong>Administrateur</strong>
                    </div>
                    <div class="avatar">
                        <div style="width: 45px; height: 45px; background: linear-gradient(135deg, var(--primary-color), var(--success-color)); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold;">
                            A
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Stats Cards dynamiques -->
        <div class="row g-4 mb-4">
            <div class="col-xl-3 col-md-6">
                <div class="stats-card">
                    <div class="stats-icon" style="background: rgba(67, 97, 238, 0.1); color: var(--primary-color);">
                        <i class="fas fa-book"></i>
                    </div>
                    <div class="stats-number" th:text="${nbCours}">0</div>
                    <div class="stats-label">Cours Actifs</div>
                </div>
            </div>
            <div class="col-xl-3 col-md-6">
                <div class="stats-card">
                    <div class="stats-icon" style="background: rgba(76, 201, 240, 0.1); color: var(--success-color);">
                        <i class="fas fa-users"></i>
                    </div>
                    <div class="stats-number" th:text="${nbEtudiants}">0</div>
                    <div class="stats-label">Étudiants</div>
                </div>
            </div>
            <div class="col-xl-3 col-md-6">
                <div class="stats-card">
                    <div class="stats-icon" style="background: rgba(247, 37, 133, 0.1); color: var(--warning-color);">
                        <i class="fas fa-chalkboard-teacher"></i>
                    </div>
                    <div class="stats-number" th:text="${nbFormateurs}">0</div>
                    <div class="stats-label">Enseignants</div>
                </div>
            </div>
           
        </div>
        
     
    </div>
    
    <!-- Footer -->
    <div th:replace="layout/footer :: footer"></div>
</body>
</html>
