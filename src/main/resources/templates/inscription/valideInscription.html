<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Valider Inscription</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <!-- <p style="color: red; font-weight: bold;">DEBUG: etudiant = <span th:text="${etudiant}"></span>, groupes = <span th:text="${groupes}"></span>, alerte = <span th:text="${alerteCapacite}"></span></p> -->
    <!-- Modal -->
    <div class="modal fade" id="valideInscriptionModal" tabindex="-1" aria-labelledby="valideInscriptionLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
<form th:action="@{/admin/demande/valider}" method="post">
                        <div class="modal-header">
                        <h5 class="modal-title" id="valideInscriptionLabel">Valider l'inscription</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="etudiantNom" class="form-label">Nom de l'étudiant</label>
                            <input type="text" class="form-control" id="etudiantNom" th:value="${etudiant.nom}" readonly>
                        </div>
                        <div class="mb-3">
                            <label for="etudiantPrenom" class="form-label">Prénom de l'étudiant</label>
                            <input type="text" class="form-control" id="etudiantPrenom" th:value="${etudiant.prenom}" readonly>
                        </div>
                        <div class="mb-3">
                            <label for="groupe" class="form-label">Groupe</label>
                            <select class="form-select" id="groupe" name="groupe.id" required>
                                <option th:each="groupe : ${groupes}"
                                    th:value="${groupe.id}"
                                    th:text="${groupe.code}"
                                    th:attr="data-capacite=${groupe.capacite},data-inscriptions=${groupe.inscriptions.size()}"></option>
                                </select>
                                <div id="alerteCapacite" th:if="${alerteCapacite}" class="alert alert-danger" th:text="${alerteCapacite}" th:style="'display:' + (${alerteCapacite} != null ? 'block' : 'none')"></div>
                            </div>
                        <input type="hidden" name="etudiant.id" th:value="${etudiant.id}" />
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                        <button type="submit" class="btn btn-success">Valider</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.querySelector('form');
        const groupeSelect = document.getElementById('groupe');
        const alerte = document.getElementById('alerteCapacite');
        form.addEventListener('submit', function(e) {
            const selected = groupeSelect.options[groupeSelect.selectedIndex];
            const capacite = parseInt(selected.getAttribute('data-capacite'));
            const inscriptions = parseInt(selected.getAttribute('data-inscriptions'));
            if (!isNaN(capacite) && !isNaN(inscriptions) && inscriptions >= capacite) {
                e.preventDefault();
                alerte.textContent = 'La capacité du groupe est atteinte !';
                alerte.style.display = 'block';
            } else {
                alerte.style.display = 'none';
            }
        });

        // Ouvre la modal automatiquement au chargement de la page
        var modal = new bootstrap.Modal(document.getElementById('valideInscriptionModal'));
        modal.show();
    });
    </script>
</body>
</html>
