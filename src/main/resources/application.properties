spring.application.name=projet

# ===============================
# Database configuration (MySQL 5.1.x)
# ===============================
spring.datasource.driverClassName=com.mysql.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/springdb?useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===============================
# Thymeleaf / Encoding
# ===============================
spring.thymeleaf.encoding=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.charset=UTF-8
spring.http.encoding.force=true



# ===============================
# SendGrid API Key (variable d'environnement recommandée)
# ===============================
sendgrid.api.key=${SENDGRID_API_KEY}
